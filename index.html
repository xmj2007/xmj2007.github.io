<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a12">
<title>小摩羯 · 高考倒计时</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --fire: #ff4e00;
  --gold: #ffb347;
  --deep: #080810;
  --card: rgba(255,255,255,0.045);
  --border: rgba(255,150,40,0.18);
  --text: #ffffff;
  --muted: rgba(255,255,255,0.45);
}
html, body {
  width:100%; min-height:100%;
  background: var(--deep);
  color: var(--text);
  font-family: 'Noto Serif SC', 'PingFang SC', serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content:''; position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 90% 55% at 50% 0%, rgba(160,50,0,0.38) 0%, transparent 65%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(80,20,0,0.25) 0%, transparent 60%);
  pointer-events:none;
}
body::after {
  content:''; position:fixed; inset:0; z-index:1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.032; pointer-events:none;
}
canvas#bgc { position:fixed; inset:0; z-index:0; pointer-events:none; }
.page {
  position:relative; z-index:2;
  max-width:430px; margin:0 auto;
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  padding:0 22px 48px;
}
.logo-bar {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:54px 0 16px;
  animation: fadeDown .7s ease both;
}
.logo-name {
  font-size:17px; font-weight:900; letter-spacing:3px;
  background: linear-gradient(90deg,#ffb347,#ff4e00);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.logo-pill {
  font-size:11px; color:var(--gold);
  border:1px solid var(--border);
  padding:4px 12px; border-radius:20px; letter-spacing:1px;
  font-family: sans-serif;
}
.hero {
  width:100%; text-align:center;
  padding:12px 0 0;
  animation: fadeUp .85s .08s ease both;
}
.hero-eyebrow {
  font-size:11px; letter-spacing:5px; color:var(--gold);
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-bottom:20px; font-family:sans-serif;
}
.hero-eyebrow::before,.hero-eyebrow::after {
  content:''; flex:1; max-width:36px; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}
.hero-eyebrow::after { background:linear-gradient(90deg,var(--gold),transparent); }
.hero-sub { font-size:13px; color:var(--muted); letter-spacing:1px; margin-bottom:8px; }
.arc-outer {
  position:relative; width:240px; height:122px; margin:0 auto 0;
}
.arc-outer svg { overflow:visible; }
.arc-pct-label {
  position:absolute; bottom:-2px; left:50%; transform:translateX(-50%);
  font-size:11px; color:var(--muted); white-space:nowrap;
  font-family:sans-serif; letter-spacing:1px;
}
.days-wrap {
  display:flex; align-items:flex-end; justify-content:center; gap:6px;
  margin: 4px 0 6px;
}
.days-num {
  font-size:clamp(86px,21vw,108px); font-weight:900; line-height:1;
  background: linear-gradient(150deg, #fff 15%, #ffb347 55%, #ff4e00 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 0 24px rgba(255,100,0,0.45));
  animation: pulseGlow 3.5s ease-in-out infinite;
}
.days-unit { font-size:26px; color:var(--gold); padding-bottom:14px; font-weight:700; }
@keyframes pulseGlow {
  0%,100%{ filter: drop-shadow(0 0 18px rgba(255,100,0,0.35)); }
  50%{ filter: drop-shadow(0 0 42px rgba(255,180,0,0.65)); }
}
.date-hint { font-size:12px; color:var(--muted); letter-spacing:1px; font-family:sans-serif; }
.motto-card {
  width:100%; margin:26px 0 18px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:26px; padding:26px 24px 22px;
  position:relative; overflow:hidden;
  backdrop-filter:blur(12px);
  animation: fadeUp .85s .25s ease both;
}
.motto-card::before {
  content:'❝'; position:absolute; top:8px; left:16px;
  font-size:52px; color:var(--fire); opacity:.12;
  line-height:1; font-family:Georgia,serif;
}
.motto-main {
  font-size:17px; line-height:1.85; text-align:center;
  position:relative; z-index:1; margin-bottom:14px;
}
.motto-main em { font-style:normal; color:var(--gold); }
.motto-by {
  font-size:12px; color:var(--muted); text-align:center;
  letter-spacing:2px; font-family:sans-serif;
}
.wx-tip {
  width:100%; margin-bottom:20px;
  background:linear-gradient(135deg,rgba(255,78,0,.07),rgba(255,179,71,.05));
  border:1px solid rgba(255,120,0,.16);
  border-radius:22px; padding:20px 22px;
  animation: fadeUp .85s .35s ease both;
}
.wx-tip-head {
  font-size:12px; color:var(--gold); letter-spacing:2px;
  margin-bottom:14px; display:flex; align-items:center; gap:6px;
  font-family:sans-serif;
}
.steps { display:flex; flex-direction:column; gap:11px; }
.step { display:flex; align-items:center; gap:13px; }
.step-n {
  width:26px; height:26px; flex-shrink:0;
  background:linear-gradient(135deg,#ff4e00,#ffb347);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff; font-family:sans-serif;
}
.step-t { font-size:13px; color:rgba(255,255,255,.72); }
.step-t strong { color:#fff; }
.cta {
  display:block; width:100%; text-decoration:none;
  background:linear-gradient(135deg,#ff4e00 0%,#ffb347 100%);
  color:#fff; border-radius:22px; padding:19px 24px;
  text-align:center;
  font-size:16px; font-weight:700; letter-spacing:1.5px;
  box-shadow: 0 8px 36px rgba(255,78,0,.38), 0 2px 8px rgba(0,0,0,.35);
  animation: fadeUp .85s .45s ease both;
  position:relative; overflow:hidden;
  transition: transform .15s, box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.cta::after {
  content:''; position:absolute; top:0; left:-120%; width:55%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  animation: shine 3.5s 1.8s infinite;
}
@keyframes shine { 0%{left:-120%} 100%{left:200%} }
.cta:active { transform:scale(.97); box-shadow:0 4px 18px rgba(255,78,0,.3); }
.cta-sub { font-size:11px; opacity:.82; margin-top:4px; font-weight:400; letter-spacing:.5px; }
.foot {
  margin-top:30px;
  font-size:11px; color:rgba(255,255,255,.18); letter-spacing:1px;
  text-align:center; font-family:sans-serif;
  animation: fadeUp .85s .55s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(22px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeDown {
  from { opacity:0; transform:translateY(-14px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div class="page">
  <div class="logo-bar">
    <div class="logo-name">小摩羯</div>
    <div class="logo-pill">高考志愿平台</div>
  </div>
  <div class="hero">
    <div class="hero-eyebrow">⏰ 高考倒计时</div>
    <div class="hero-sub">每一秒都是未来的筹码</div>
    <div class="arc-outer">
      <svg width="240" height="122" viewBox="0 0 240 122">
        <defs>
          <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff4e00"/>
            <stop offset="100%" stop-color="#ffb347"/>
          </linearGradient>
        </defs>
        <path id="arcBg" d="M 24 120 A 96 96 0 0 1 216 120"
          fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="9"/>
        <path id="arcFg" d="M 24 120 A 96 96 0 0 1 216 120"
          fill="none" stroke="url(#ag)" stroke-width="9" stroke-linecap="round"
          style="filter:drop-shadow(0 0 7px rgba(255,120,0,.7))"/>
      </svg>
      <div class="arc-pct-label" id="pctLabel">已备考 0%</div>
    </div>
    <div class="days-wrap">
      <div class="days-num" id="dNum">--</div>
      <div class="days-unit">天</div>
    </div>
    <div class="date-hint">距离 2026 年高考（6月7日）</div>
  </div>
  <div class="motto-card">
    <div class="motto-main" id="mottoEl">
      小摩羯，你要加油啊！<br>
      <em>乾坤未定，你我皆是黑马！</em>
    </div>
    <div class="motto-by">—— 致奋斗的你</div>
  </div>
  <div class="wx-tip" id="wxTip" style="display:none">
    <div class="wx-tip-head">📱 微信内请用浏览器打开</div>
    <div class="steps">
      <div class="step"><div class="step-n">1</div><div class="step-t">点击右上角 <strong>···</strong> 三个点</div></div>
      <div class="step"><div class="step-n">2</div><div class="step-t">选择 <strong>"在浏览器中打开"</strong></div></div>
      <div class="step"><div class="step-n">3</div><div class="step-t">在浏览器中继续访问平台</div></div>
    </div>
  </div>
  <a href="home.html" class="cta" id="ctaBtn" style="display:none">
    🚀 进入2026年高考志愿数据平台 <br>
    <div class="cta-sub">强基计划 · 专业信息 · 录取分数线查询</div>
  </a>
  <div class="foot">© 2026 小摩羯 &nbsp;·&nbsp; 数据仅供参考</div>
</div>
<script>
(function(){
  var gaokao = new Date('2026-06-07T00:00:00');
  var start  = new Date('2025-09-01T00:00:00');
  var total  = (gaokao - start) / 86400000;
  var arcFg  = document.getElementById('arcFg');
  var arcLen;
  requestAnimationFrame(function(){
    arcLen = arcFg.getTotalLength();
    arcFg.style.strokeDasharray = arcLen;
    tick();
  });
  function tick(){
    var now  = new Date();
    var diff = gaokao - now;
    var days = diff > 0 ? Math.ceil(diff / 86400000) : 0;
    document.getElementById('dNum').textContent = days;
    var elapsed = total - days;
    var pct = Math.min(Math.max(elapsed / total, 0), 1);
    document.getElementById('pctLabel').textContent = '已备考 ' + Math.round(pct*100) + '%';
    if(arcLen) arcFg.style.strokeDashoffset = arcLen * (1 - pct);
  }
  setInterval(tick, 60000);
})();
var mottos = [
  '小摩羯，你要加油啊！<br><em>乾坤未定，你我皆是黑马！</em>',
  '没有人能随随便便成功，<br><em>拼尽全力，才是对青春的交代。</em>',
  '现在流的每一滴汗，<br><em>都是通往梦想的铺路石。</em>',
  '你比你想象中更强大，<br><em>高考只是起点，不是终点。</em>',
  '坚持住，黎明前的黑暗，<br><em>只是为了让日出更耀眼。</em>',
];
document.getElementById('mottoEl').innerHTML = mottos[Math.floor(Math.random() * mottos.length)];
// 微信判断：微信内显示提示，非微信显示跳转按钮
if (/MicroMessenger/i.test(navigator.userAgent)) {
  document.getElementById('wxTip').style.display = 'block';
} else {
  document.getElementById('ctaBtn').style.display = 'flex';
}
(function(){
  var cvs = document.getElementById('bgc');
  var ctx = cvs.getContext('2d');
  var W, H, pts = [];
  function resize(){ W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  function Pt(){
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.r = Math.random()*1.6+0.3;
    this.vx = (Math.random()-.5)*.28;
    this.vy = -(Math.random()*.45+.12);
    this.a = Math.random()*.45+.08;
    this.c = Math.random()>.5 ? '#ff7a2a' : '#ffcc44';
  }
  for(var i=0;i<65;i++) pts.push(new Pt());
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c; ctx.globalAlpha=p.a; ctx.fill();
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-6){ p.y=H+6; p.x=Math.random()*W; }
      if(p.x<0||p.x>W) p.vx*=-1;
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
