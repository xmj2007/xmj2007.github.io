<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小摩羯高考志愿数据平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 25px;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 { font-size: 22px; margin-bottom: 10px; font-weight: 600; }
        .subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 25px; }
        .url-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            color: #ffd700;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            background: #ffd700;
            color: #333;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        .tips {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.6;
        }
        .arrow {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <h1>小摩羯高考志愿</h1>
        <p class="subtitle">2026年最新高考数据平台</p>
        
        <p style="font-size: 15px; margin-bottom: 15px;">请点击下方按钮复制链接<br>在手机浏览器中打开</p>
        
        <div class="arrow">👇</div>
        
        <div class="url-box" id="urlText">https://xmj.xo.je/</div>
        
        <button class="btn" onclick="copyLink()">📋 点击复制链接</button>

        <div class="tips">
            <p><strong>操作步骤：</strong></p>
            <p>1. 点击上方"点击复制链接"按钮</p>
            <p>2. 打开手机浏览器（Safari/Chrome）</p>
            <p>3. 在地址栏粘贴并访问</p>
        </div>
    </div>

    <script>
        function copyLink() {
            const url = 'https://xmj.xo.je/';
            const urlText = document.getElementById('urlText');
            
            // 选中文字视觉反馈
            urlText.style.background = 'rgba(255,215,0,0.3)';
            
            // 复制到剪贴板
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function() {
                    showSuccess();
                }).catch(function() {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            
            try {
                document.execCommand('copy');
                showSuccess();
            } catch (err) {
                alert('复制失败，请手动复制上方黄色链接');
            }
            
            document.body.removeChild(input);
        }

        function showSuccess() {
            const btn = document.querySelector('.btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ 已复制！请去浏览器粘贴';
            btn.style.background = '#4ade80';
            
            setTimeout(function() {
                btn.innerHTML = originalText;
                btn.style.background = '#ffd700';
                document.getElementById('urlText').style.background = 'rgba(0,0,0,0.3)';
            }, 3000);
        }
    </script>
</body>
</html>
