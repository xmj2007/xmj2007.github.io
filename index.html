<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小摩羯高考志愿数据平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 360px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; font-weight: 600; }
        .subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 30px; }
        .warning-box {
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 4px solid #ffd700;
        }
        .warning-box p {
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }
        .btn-primary {
            display: block;
            width: 100%;
            padding: 16px 24px;
            background: #ffd700;
            color: #333;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #ffed4e;
            transform: translateY(-2px);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 14px 24px;
            background: transparent;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .tips {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎓</div>
        <h1>小摩羯高考志愿</h1>
        <p class="subtitle">2026年最新高考数据平台</p>
        
        <div class="warning-box">
            <p>⚠️ 微信提示"非官方网站"是正常现象，因为我们的域名使用了海外后缀（.je），请放心访问。</p>
        </div>

        <!-- 方案1：直接点击跳转（可能仍被拦截） -->
        <a href="https://xmj.xo.je/" class="btn-primary" onclick="return handleClick(event)">
            👉 点击进入网站
        </a>

        <!-- 方案2：复制链接到浏览器打开（最可靠） -->
        <button class="btn-secondary" onclick="copyLink()">
            📋 复制链接到浏览器打开
        </button>

        <div class="tips">
            如果上方按钮无效，请点击"复制链接"<br>
            然后打开手机浏览器粘贴访问
        </div>
    </div>

    <script>
        function handleClick(e) {
            // 尝试跳转，如果被拦截就提示复制
            setTimeout(function() {
                alert('如果页面未打开，请点击"复制链接到浏览器打开"');
            }, 500);
            return true;
        }

        function copyLink() {
            const url = 'https://xmj.xo.je/';
            
            // 复制到剪贴板
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function() {
                    alert('链接已复制！\n请打开手机浏览器，粘贴地址栏访问');
                });
            } else {
                // 兼容旧版浏览器
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('链接已复制！\n请打开手机浏览器，粘贴地址栏访问');
            }
        }

        // 检测是否在<-i- style="color: #6b7280; font-style: italic;">微信</->内
        function isWeixin() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        // 非<-i- style="color: #6b7280; font-style: italic;">微信</->环境自动跳转
        window.onload = function() {
            if (!isWeixin()) {
                window.location.href = 'https://xmj.xo.je/';
            }
        };
    </script>
</body>
</html>
