<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;
  background:#F7F4EF;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  color:#0F1923;
}

/* 卡片容器（Apple风） */
.container{
  width:100%;
  max-width:320px;

  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-radius:20px;
  padding:28px 20px;

  text-align:center;

  box-shadow:0 10px 30px rgba(0,0,0,.08);
  border:1px solid rgba(15,25,35,.06);
}

/* loading（更柔和） */
.loading{
  width:42px;
  height:42px;
  margin:0 auto 18px;

  border:3px solid rgba(0,0,0,.08);
  border-top-color:#C8943A;
  border-radius:50%;

  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* 标题 */
h1{
  font-size:16px;
  font-weight:600;
  margin-bottom:6px;
}

/* 说明文字 */
p{
  font-size:13px;
  color:rgba(15,25,35,.5);
  margin-bottom:18px;
}

/* 按钮（Apple + 品牌色） */
.manual-link{
  display:inline-block;

  font-size:14px;
  text-decoration:none;

  padding:10px 18px;
  border-radius:12px;

  background:rgba(200,148,58,.12);
  color:#A07A2F;

  transition:all .15s;
}

.manual-link:hover{
  background:rgba(200,148,58,.2);
}

.manual-link:active{
  transform:scale(.95);
}
</style>
